plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// 1.3.54: corrige corrida capturada ao vivo mas sem o valor da oferta
// (captura_incompleta) — antes nunca casava com a leitura do Histórico
// (ficava pra sempre sem valor) e ainda virava um "conferencia" duplicado
// da mesma corrida. Agora casa por plataforma+horário quando não há valor
// pra comparar, e preenche o valor oficial em vez de duplicar.
android {
    namespace 'io.github.yurisilva90.smartmobi'
    compileSdk 34
    defaultConfig {
        applicationId "io.github.yurisilva90.smartmobi"
        minSdk 24
        targetSdk 34
        versionCode 266
        versionName "1.3.54"
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { versionNameSuffix "-debug" }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
