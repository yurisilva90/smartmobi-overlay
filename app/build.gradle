plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// 1.3.61: R$/hora e R$/km-por-minuto mostrando número absurdo (caso real do
// Yuri, mesma sessão: R$900,60/hora numa corrida de R$15). Causa: quando o
// parser só lê UMA perna da oferta (só o tempo de chegada até o passageiro,
// não o tempo da corrida em si), "min" ficava artificialmente pequeno e a
// divisão explodia pra um número sem relação com a realidade — mostrado
// grande e verde no card, podendo levar a aceitar uma corrida achando que
// paga muito mais do que paga. Agora exige pelo menos 2 minutos de tempo
// lido pra confiar nesse cálculo; abaixo disso, simplesmente não mostra a
// métrica (mesmo padrão já usado quando não há custo/km configurado).
// 1.3.60: card de oferta "travando" no meio da corrida (caso real do Yuri,
// 14/09/2026): toda vez que o app da 99 saía do foreground por um instante
// (motorista olhando o mapa, a bolinha, uma notificação) e voltava, a MESMA
// oferta ainda intacta na tela era tratada como oferta NOVA de novo — reabria
// o card e podia repetir o áudio, hora após hora, pra oferta que já tinha
// sido vista. Causa: perder o foreground de Uber/99 por um instante já
// apagava toda a memória de "essa oferta eu já mostrei", não só escondia o
// card. Agora só esconde; a memória só é apagada quando a oferta sai da tela
// de verdade ou a jornada é encerrada. Não afeta a corrida em andamento —
// só o card visual (confirmado: overlapOfferByPlat já tratava oferta vista
// durante corrida ativa como oferta separada, corretamente).
// 1.3.59: blindagem do banco e da captura de corrida.
// - Corrida pendente agora tem identificador calculado no celular: se o envio
//   chegou ao banco mas a resposta se perdeu, o reenvio é recusado em vez de
//   criar uma corrida DUPLICADA.
// - Reenvio de pendência com espera crescente (30s → 30min) em vez de fixo a
//   cada 15s, e para de insistir quando o banco recusa o dado (erro de dado,
//   não de rede) — mantendo o registro em disco pra recuperação manual.
// - Log de diagnóstico não grava mais a MESMA linha repetida: tela parada
//   agora vira 1 linha por minuto em vez de ~1.200 por hora.
// - Versão do app reportada com o token do motorista (a tabela não aceita
//   mais escrita com a chave pública) e 1x por hora em vez de a cada 3min.
// 1.3.58: CRÍTICO — corrige RuleEngine.refreshIfDue gerando uma tempestade
// de requisições (~4000 em 15min num incidente real) contra o próprio
// banco sempre que o banco tem qualquer instabilidade. Causa: o intervalo
// de 10min entre buscas só era marcado em caso de SUCESSO — com o banco
// falhando, cada leitura de tela (a cada ~600ms) tentava buscar de novo,
// nunca respeitando o intervalo. Agora marca a tentativa na hora, sucesso
// ou falha.
android {
    namespace 'io.github.yurisilva90.smartmobi'
    compileSdk 34
    defaultConfig {
        applicationId "io.github.yurisilva90.smartmobi"
        minSdk 24
        targetSdk 34
        versionCode 273
        versionName "1.3.61"
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { versionNameSuffix "-debug" }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
