plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// 1.3.57: tira uma SEGUNDA trava de 4 informações ativas na bolinha, essa
// no lado nativo (loadConfig) — reforçava o mesmo limite já removido na
// 1.3.56 do lado do site, desativando em silêncio qualquer indicador além
// do 4º mesmo com tudo ligado na tela. Era a causa real de "a bolinha não
// cresce" e de Ganho/R$-km sumidos mesmo com a corrida certa no card.
android {
    namespace 'io.github.yurisilva90.smartmobi'
    compileSdk 34
    defaultConfig {
        applicationId "io.github.yurisilva90.smartmobi"
        minSdk 24
        targetSdk 34
        versionCode 269
        versionName "1.3.57"
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { versionNameSuffix "-debug" }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
