plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// 1.3.59: blindagem do banco e da captura de corrida.
// - Corrida pendente agora tem identificador calculado no celular: se o envio
//   chegou ao banco mas a resposta se perdeu, o reenvio é recusado em vez de
//   criar uma corrida DUPLICADA.
// - Reenvio de pendência com espera crescente (30s → 30min) em vez de fixo a
//   cada 15s, e para de insistir quando o banco recusa o dado (erro de dado,
//   não de rede) — mantendo o registro em disco pra recuperação manual.
// - Log de diagnóstico não grava mais a MESMA linha repetida: tela parada
//   agora vira 1 linha por minuto em vez de ~1.200 por hora.
// - Versão do app reportada com o token do motorista (a tabela não aceita
//   mais escrita com a chave pública) e 1x por hora em vez de a cada 3min.
// 1.3.58: CRÍTICO — corrige RuleEngine.refreshIfDue gerando uma tempestade
// de requisições (~4000 em 15min num incidente real) contra o próprio
// banco sempre que o banco tem qualquer instabilidade. Causa: o intervalo
// de 10min entre buscas só era marcado em caso de SUCESSO — com o banco
// falhando, cada leitura de tela (a cada ~600ms) tentava buscar de novo,
// nunca respeitando o intervalo. Agora marca a tentativa na hora, sucesso
// ou falha.
android {
    namespace 'io.github.yurisilva90.smartmobi'
    compileSdk 34
    defaultConfig {
        applicationId "io.github.yurisilva90.smartmobi"
        minSdk 24
        targetSdk 34
        versionCode 271
        versionName "1.3.59"
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { versionNameSuffix "-debug" }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
