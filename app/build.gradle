plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// 1.3.58: CRÍTICO — corrige RuleEngine.refreshIfDue gerando uma tempestade
// de requisições (~4000 em 15min num incidente real) contra o próprio
// banco sempre que o banco tem qualquer instabilidade. Causa: o intervalo
// de 10min entre buscas só era marcado em caso de SUCESSO — com o banco
// falhando, cada leitura de tela (a cada ~600ms) tentava buscar de novo,
// nunca respeitando o intervalo. Agora marca a tentativa na hora, sucesso
// ou falha.
android {
    namespace 'io.github.yurisilva90.smartmobi'
    compileSdk 34
    defaultConfig {
        applicationId "io.github.yurisilva90.smartmobi"
        minSdk 24
        targetSdk 34
        versionCode 270
        versionName "1.3.58"
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { versionNameSuffix "-debug" }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
