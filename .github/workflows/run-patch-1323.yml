name: Run patch 1.3.23
on:
  push:
    paths:
      - '.github/scripts/patch_1323.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_1323.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m 'Fix Uber offer ownership and notification layout' || exit 0
          git push
