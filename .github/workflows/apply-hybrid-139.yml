name: Apply hybrid 1.3.9
on:
  push:
    branches: [ notif-hybrid-1-3-9 ]
    paths:
      - '.github/workflows/apply-hybrid-139.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notif-hybrid-1-3-9
      - name: Aplicar ajustes Android
        run: python3 .tmp-apply-hybrid-139.py
      - name: Compilar antes de publicar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar patch na branch
        run: |
          rm -f .tmp-apply-hybrid-139.py .github/workflows/apply-hybrid-139.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: detector híbrido Uber 99 e vídeo nativo 1.3.9"
          git push origin HEAD:notif-hybrid-1-3-9
