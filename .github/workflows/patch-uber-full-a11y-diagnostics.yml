name: Patch Uber full accessibility diagnostics
on:
  push:
    paths:
      - '.github/workflows/patch-uber-full-a11y-diagnostics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply diagnostic patch
        run: python3 scripts/patch_uber_full_a11y.py
      - name: Commit diagnostic patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m "Capture full Uber accessibility diagnostics"
          git push
