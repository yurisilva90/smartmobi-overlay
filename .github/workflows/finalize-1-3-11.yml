name: Finalize 1.3.11
on:
  push:
    branches: [ finalize-1-3-11 ]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize-1-3-11
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Apply final source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(s, old, new, label, count=1):
              n=s.count(old)
              if n != count:
                  raise SystemExit(f'{label}: esperado {count}, encontrado {n}')
              return s.replace(old,new)

          # AutoTripCapture: marco real de chegada ao passageiro + tempo de espera.
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt')
          s=p.read_text()
          s=rep(s,
              '        var tripStartedAt: Long = 0L,\n        var tripStartKm: Double = 0.0,\n',
              '        var pickupArrivedAt: Long = 0L,\n        var tripStartedAt: Long = 0L,\n        var tripStartKm: Double = 0.0,\n',
              'buffer pickupArrivedAt')
          s=rep(s,
              '                put("pickupStartKm", b.pickupStartKm)\n                put("tripStartedAt", b.tripStartedAt)\n',
              '                put("pickupStartKm", b.pickupStartKm)\n                put("pickupArrivedAt", b.pickupArrivedAt)\n                val waitEnd = if (b.tripStartedAt > 0) b.tripStartedAt else System.currentTimeMillis()\n                put("passengerWaitSec", if (b.pickupArrivedAt > 0 && waitEnd >= b.pickupArrivedAt) ((waitEnd - b.pickupArrivedAt) / 1000L).toInt() else JSONObject.NULL)\n                put("tripStartedAt", b.tripStartedAt)\n',
              'live wait')
          marker='    fun setPassengerNameIfEmpty(plat: String, name: String?) {'
          helper='''    // Marca a chegada física ao passageiro apenas quando existe uma corrida em Buscar.\n    // É one-shot: releituras/notificações repetidas nunca reiniciam o cronômetro.\n    fun markPickupArrived(plat: String, atMs: Long = System.currentTimeMillis()) {\n        val b = buffer ?: return\n        if (b.platform != plat || b.tripStartedAt > 0L || b.pickupArrivedAt > 0L) return\n        b.pickupArrivedAt = atMs\n    }\n\n'''
          if marker not in s: raise SystemExit('markPickupArrived marker ausente')
          s=s.replace(marker, helper+marker, 1)
          s=rep(s,
              '                    put("pickup_started_at", iso(b.pickupStartedAt))\n                    put("trip_started_at", iso(b.tripStartedAt))\n',
              '                    put("pickup_started_at", iso(b.pickupStartedAt))\n                    put("pickup_arrived_at", iso(b.pickupArrivedAt))\n                    put("passenger_wait_sec", if (b.pickupArrivedAt > 0L && b.tripStartedAt >= b.pickupArrivedAt) ((b.tripStartedAt - b.pickupArrivedAt) / 1000L).toInt() else JSONObject.NULL)\n                    put("trip_started_at", iso(b.tripStartedAt))\n',
              'persist wait')
          p.write_text(s)

          # TripReaderService: sinais fortes Uber/99 + notificações oficiais e notificação de rota persistente.
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt')
          s=p.read_text()
          s=rep(s,
              '        fun onOfficialNotification(platform: String, texts: List<String>, offerHint: Boolean) {\n            instance?.handleOfficialNotification(platform, texts, offerHint)\n        }\n',
              '        fun onOfficialNotification(platform: String, texts: List<String>, offerHint: Boolean) {\n            instance?.handleOfficialNotification(platform, texts, offerHint)\n        }\n\n        @JvmStatic\n        fun onOfficialOperationalNotification(platform: String, keywords: List<String>, actions: List<String>) {\n            instance?.handleOfficialOperationalNotification(platform, keywords, actions)\n        }\n',
              'official operational bridge')
          marker='    private fun pollForeground() {'
          helper='''    private fun handleOfficialOperationalNotification(plat: String, keywords: List<String>, actions: List<String>) {\n        if (plat != "UBER" && plat != "99") return\n        val strongArrival = keywords.any { it == "cheguei" || it == "iniciar" } ||\n            actions.any { it == "cheguei" || it == "iniciar" }\n        if (strongArrival) AutoTripCapture.markPickupArrived(plat)\n    }\n\n'''
          if marker not in s: raise SystemExit('operational handler marker ausente')
          s=s.replace(marker, helper+marker, 1)
          s=rep(s,
              '        val joined = texts.joinToString(" ")\n        uberDestinoDeRe.find(joined)',
              '        val joined = texts.joinToString(" ")\n        val joinedLow = joined.lowercase(Locale.getDefault())\n        if (joinedLow.contains("cheguei") || joinedLow.contains("aguardando passageiro") ||\n            joinedLow.contains("iniciar viagem") || joinedLow.contains("iniciar corrida")) {\n            AutoTripCapture.markPickupArrived("UBER")\n        }\n        uberDestinoDeRe.find(joined)',
              'uber arrival')
          s=rep(s,
              '        if (temEspera && !temChegueAntes) {\n            nn99ReachedPickupReason = "ocr:espera_embarque"\n',
              '        if (temEspera && !temChegueAntes) {\n            AutoTripCapture.markPickupArrived("99")\n            nn99ReachedPickupReason = "ocr:espera_embarque"\n',
              '99 arrival')
          timeout='        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) builder.setTimeoutAfter(20 * 60 * 1000L)\n'
          if timeout not in s: raise SystemExit('route timeout nao encontrado')
          s=s.replace(timeout,'',1)
          p.write_text(s)

          # NotificationListener: além do diagnóstico, alimenta marcos operacionais oficiais.
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt')
          s=p.read_text()
          old='''        try {\n            n.actions?.forEach { a -> operationalAction(a.title?.toString().orEmpty())?.let { actionLabels.add(it) } }\n        } catch (_: Exception) {}\n\n        // Só vira gatilho forte quando a própria notificação traz sinais de\n'''
          new='''        try {\n            n.actions?.forEach { a -> operationalAction(a.title?.toString().orEmpty())?.let { actionLabels.add(it) } }\n        } catch (_: Exception) {}\n\n        if (eventType == "posted") {\n            TripReaderService.onOfficialOperationalNotification(platform, keywords.distinct(), actionLabels.distinct())\n        }\n\n        // Só vira gatilho forte quando a própria notificação traz sinais de\n'''
          s=rep(s,old,new,'notification operational signal')
          p.write_text(s)

          # Versão final consolidada.
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace('// 1.3.9: notificações oficiais Uber/99 + plataforma estável + vídeo nativo.', '// 1.3.11: notificações oficiais + rota/Flash + paradas + espera do passageiro + vídeo nativo.')
          s=rep(s,'        versionCode 223\n        versionName "1.3.10"\n','        versionCode 224\n        versionName "1.3.11"\n','version bump')
          p.write_text(s)
          PY
      - name: Validate source invariants
        run: |
          grep -q 'versionCode 224' app/build.gradle
          grep -q 'versionName "1.3.11"' app/build.gradle
          grep -q 'passenger_wait_sec' app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'markPickupArrived("99")' app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt
          grep -q 'markPickupArrived("UBER")' app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt
          grep -q 'onOfficialOperationalNotification' app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt
          ! grep -q 'setTimeoutAfter(20 \* 60 \* 1000L)' app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Commit validated package and self-clean
        run: |
          rm -f .github/workflows/finalize-1-3-11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: consolidar pacote operacional MoB 1.3.11'
          git push origin HEAD:finalize-1-3-11
