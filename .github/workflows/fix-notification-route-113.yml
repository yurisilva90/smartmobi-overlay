name: Fix Notification Route 1.3.13
on:
  push:
    paths:
      - '.github/workflows/fix-notification-route-113.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt')
          s=p.read_text()

          # Endereço contextual: dentro da perna da oferta aceitamos também nomes de locais
          # (shopping, terminal, condomínio etc.), mantendo filtros fortes contra UI/valores.
          old='''        fun normAddress(raw: String): String = cleanAddress(raw)\n            .lowercase(Locale.getDefault())\n            .replace(Regex("""[\\s,.;:–—-]+"""), " ")\n            .trim()\n\n        fun candidateAt(index: Int): String? {\n            if (index !in texts.indices) return null\n            val cur = cleanAddress(texts[index])\n            if (looksLikeAddress(cur)) return cur\n            // Alguns OCRs quebram "Rua X" e "120 - Bairro" em linhas distintas.\n            val hasStreet = Regex("""\\b(rua|r\\.?|av\\.?|avenida|estrada|travessa|alameda|rodovia|pra[çc]a|largo|ladeira|rod\\.?|via\\b)""", RegexOption.IGNORE_CASE).containsMatchIn(cur)\n            if (hasStreet && index + 1 in texts.indices) {\n                val next = cleanAddress(texts[index + 1])\n                if (Regex("""^\\d{1,5}\\b""").containsMatchIn(next)) {\n                    val joinedAddress = "$cur, $next"\n                    if (looksLikeAddress(joinedAddress)) return joinedAddress\n                }\n            }\n            return null\n        }\n'''
          new='''        fun normAddress(raw: String): String = cleanAddress(raw)\n            .lowercase(Locale.getDefault())\n            .replace(Regex("""[\\s,.;:–—-]+"""), " ")\n            .trim()\n\n        // Dentro do trecho imediatamente ligado a uma perna (min/km), a posição\n        // já é uma evidência forte de endereço. Por isso aceitamos nomes de locais\n        // sem "Rua" ou número, mas continuamos rejeitando métricas, botões e UI.\n        fun looksLikeContextAddress(raw: String): Boolean {\n            if (looksLikeAddress(raw)) return true\n            val sl = cleanAddress(raw).lowercase(Locale.getDefault())\n            if (sl.length < 5 || sl.length > 140) return false\n            if (!Regex("""[a-záàâãéèêíïóôõöúç]""", RegexOption.IGNORE_CASE).containsMatchIn(sl)) return false\n            if (Regex("""^\\(?\\s*\\d{1,3}([.,]\\d+)?\\s*(min|minutos|km|m)\\b""").containsMatchIn(sl)) return false\n            if (Regex("""^[x%\\d.,\\s]+$""").containsMatchIn(sl)) return false\n            val blocked = listOf(\n                "aceitar", "selecionar", "escolher", "recusar", "corridas", "corrida",\n                "r$", "/km", "tarifa", "taxa de espera", "dinheiro", "pgto. no app",\n                "perfil essencial", "perfil premium", "perfil prata", "online", "buscando",\n                "verif.", "cpf", "negocia", "qr code", "não afeta", "nao afeta"\n            )\n            if (blocked.any { sl.contains(it) }) return false\n            return true\n        }\n\n        fun candidateAt(index: Int, contextual: Boolean = false): String? {\n            if (index !in texts.indices) return null\n            val cur = cleanAddress(texts[index])\n            if (looksLikeAddress(cur) || (contextual && looksLikeContextAddress(cur))) return cur\n            // Alguns OCRs quebram "Rua X" e "120 - Bairro" em linhas distintas.\n            val hasStreet = Regex("""\\b(rua|r\\.?|av\\.?|avenida|estrada|travessa|alameda|rodovia|pra[çc]a|largo|ladeira|rod\\.?|via\\b)""", RegexOption.IGNORE_CASE).containsMatchIn(cur)\n            if (hasStreet && index + 1 in texts.indices) {\n                val next = cleanAddress(texts[index + 1])\n                if (Regex("""^\\d{1,5}\\b""").containsMatchIn(next)) {\n                    val joinedAddress = "$cur, $next"\n                    if (looksLikeAddress(joinedAddress)) return joinedAddress\n                }\n            }\n            return null\n        }\n'''
          assert old in s, 'candidateAt anchor não encontrado'
          s=s.replace(old,new,1)

          old2='''                    val c = candidateAt(j)\n                    if (c != null) { addCandidate(j, c); break }'''
          new2='''                    val c = candidateAt(j, contextual = true)\n                    if (c != null) { addCandidate(j, c); break }'''
          assert old2 in s, 'leg scan anchor não encontrado'
          s=s.replace(old2,new2,1)

          # addCandidate precisa aceitar o candidato contextual já validado.
          old3='''        fun addCandidate(index: Int, value: String?) {\n            val v = value?.let(::cleanAddress)?.takeIf { looksLikeAddress(it) } ?: return'''
          new3='''        fun addCandidate(index: Int, value: String?) {\n            val v = value?.let(::cleanAddress)?.takeIf { looksLikeAddress(it) || looksLikeContextAddress(it) } ?: return'''
          assert old3 in s, 'addCandidate anchor não encontrado'
          s=s.replace(old3,new3,1)

          # Notificação: thumbnail visível recolhida + imagem completa expandida.
          old4='''        if (flashPicture != null) {\n            builder.setStyle(Notification.BigPictureStyle()\n                .bigPicture(flashPicture)'''
          new4='''        if (flashPicture != null) {\n            // Samsung/Android 10 pode esconder BigPicture enquanto a notificação\n            // está recolhida. LargeIcon mantém uma miniatura do Flash visível já\n            // no estado normal; ao expandir continua mostrando a imagem completa.\n            builder.setLargeIcon(flashPicture)\n            builder.setStyle(Notification.BigPictureStyle()\n                .bigPicture(flashPicture)'''
          assert old4 in s, 'notification picture anchor não encontrado'
          s=s.replace(old4,new4,1)
          p.write_text(s)

          # Bump versão.
          g=Path('app/build.gradle')
          gs=g.read_text()
          gs=gs.replace('// 1.3.12: checklist completo de permissões + alerta preventivo antes das ofertas.', '// 1.3.13: imagem do Flash na notificação + origem/destino/paradas mais robustos.')
          gs=gs.replace('versionCode 225','versionCode 226',1).replace('versionName "1.3.12"','versionName "1.3.13"',1)
          g.write_text(gs)
          PY
      - name: Compile
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git rm .github/workflows/fix-notification-route-113.yml
          git commit -m 'fix: completar imagem e endereços da oferta no MoB 1.3.13'
          git push
