name: Patch v1.3.20 per-platform trip state
on:
  push:
    paths:
      - '.github/workflows/patch-platform-trip-state-v1320.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.3.20 patch
        run: python3 scripts/patch_platform_trip_state_v1320.py
      - name: Commit Android sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m "Separate Uber and 99 trip states in v1.3.20"
          git push
