name: Finish Flash Notification
on:
  push:
    paths:
      - 'tools/finish_flash_notification.py'
      - '.github/workflows/finish-flash-notification.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply patch
        run: python3 tools/finish_flash_notification.py
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt app/build.gradle
          git commit -m 'fix: completar imagem e rota da notificação Flash'
          git push
