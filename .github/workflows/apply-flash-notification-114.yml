name: Apply Flash Notification 1.3.14
on:
  push:
    paths:
      - '.github/workflows/apply-flash-notification-114.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply patch
        run: python3 tools/patch_flash_notification_114.py
      - name: Normalize Android compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt')
          s=p.read_text()
          s=s.replace('            .setSilent(true)\n','')
          s=s.replace(
              'plat, overallGrade, metrics, routeMin ?: 0, routeKm ?: 0.0, declineReason, visualLines',
              'plat, overallGrade, metrics, offer.min ?: routeMin ?: 0, offer.km ?: routeKm ?: 0.0, declineReason, visualLines'
          )
          assert '.setSilent(true)' not in s
          assert 'offer.min ?: routeMin ?: 0' in s
          p.write_text(s)
          PY
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt app/build.gradle
          git rm tools/patch_flash_notification_114.py .github/workflows/apply-flash-notification-114.yml
          git commit -m 'fix: concluir notificação visual e rota no MōB 1.3.14'
          git push
