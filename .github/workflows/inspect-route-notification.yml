name: Inspect Route Notification
on:
  push:
    paths: ['.github/workflows/inspect-route-notification.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt').read_text()
          f=Path('app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt').read_text()
          def block(src,start,end):
              i=src.find(start); assert i>=0, start
              j=src.find(end,i+len(start)); assert j>=0, end
              return src[i:j]
          Path('_route_notification_function.txt').write_text(block(p,'    private fun showRouteNotification(', '    private fun sendToCloud('))
          Path('_offer_parser_function.txt').write_text(block(p,'    private fun parseOffer(texts: List<String>): Offer {', '    private fun processRealOffer('))
          i=f.find('renderNotificationBitmap'); assert i>=0, 'renderNotificationBitmap'
          a=f.rfind('\n    fun ',0,i); b=f.find('\n    fun ',i+1)
          if b<0: b=f.find('\n}',i)
          Path('_flash_bitmap_function.txt').write_text(f[a:b])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _route_notification_function.txt _offer_parser_function.txt _flash_bitmap_function.txt
          git commit -m 'chore: detalhar parser e imagem da notificação' || true
          git push
