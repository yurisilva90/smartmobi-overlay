name: Inspect Route Notification
on:
  push:
    paths: ['.github/workflows/inspect-route-notification.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt').read_text()
          keys=['private fun showRouteNotification(', 'data class Offer(', 'fun parseOffer', 'private fun parseOffer', 'origem =', 'destino =', 'onOfficialRouteInfo', 'handleOfficialRouteInfo']
          out=[]
          seen=[]
          for k in keys:
              start=0
              while True:
                  i=s.find(k,start)
                  if i<0: break
                  if not any(abs(i-x)<2500 for x in seen):
                      seen.append(i)
                      out.append('\n===== '+k+' @ '+str(i)+' =====\n'+s[max(0,i-3500):min(len(s),i+12000)])
                  start=i+len(k)
          Path('_route_notification_snippet.txt').write_text('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _route_notification_snippet.txt
          git commit -m 'chore: extrair trechos de rota e notificação' || true
          git push
