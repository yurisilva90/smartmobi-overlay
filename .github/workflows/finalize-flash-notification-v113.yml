name: Finalize Flash Notification 1.3.13
on:
  push:
    paths:
      - '.github/workflows/finalize-flash-notification-v113.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final Flash fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ── FlashCard: gera uma imagem real do mesmo card para a notificação ──
          p = Path('app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt')
          s = p.read_text()
          if 'import android.graphics.Bitmap' not in s:
              s = s.replace('import android.graphics.Color\n', 'import android.graphics.Bitmap\nimport android.graphics.Canvas\nimport android.graphics.Color\n', 1)
          anchor = '    fun keepAlive(autoHideMs: Long = 20000L) {'
          assert anchor in s, 'FlashCard keepAlive anchor missing'
          if 'fun renderNotificationBitmap(' not in s:
              method = r'''    fun renderNotificationBitmap(
        platform: String,
        overallGrade: String,
        metrics: List<Metric>,
        totalMin: Int,
        totalKm: Double,
        declineReason: String? = null,
        detailLines: List<String> = emptyList()
    ): Bitmap? {
        return try {
            val cardWidthPx = widthFor(metrics.size)
            val imageWidthPx = maxOf(cardWidthPx, dp(344))
            val outer = LinearLayout(context).apply {
                orientation = LinearLayout.VERTICAL
                gravity = Gravity.CENTER_HORIZONTAL
                setPadding(dp(8), dp(8), dp(8), dp(10))
                background = GradientDrawable().apply {
                    shape = GradientDrawable.RECTANGLE
                    cornerRadius = dpf(14)
                    setColor(Color.parseColor("#101119"))
                }
            }
            val card = buildCard(
                platform, overallGrade, metrics, totalMin, totalKm,
                cardWidthPx, declineReason
            )
            outer.addView(card, LinearLayout.LayoutParams(
                cardWidthPx, LinearLayout.LayoutParams.WRAP_CONTENT
            ).apply { gravity = Gravity.CENTER_HORIZONTAL })

            val cleanLines = detailLines.filter { it.isNotBlank() }.take(9)
            if (cleanLines.isNotEmpty()) {
                outer.addView(android.view.View(context).apply {
                    setBackgroundColor(Color.parseColor("#22FFFFFF"))
                }, LinearLayout.LayoutParams(
                    LinearLayout.LayoutParams.MATCH_PARENT, dp(1)
                ).apply { topMargin = dp(9); bottomMargin = dp(7) })
                cleanLines.forEach { line ->
                    outer.addView(TextView(context).apply {
                        text = line
                        textSize = 11.5f
                        setTextColor(Color.parseColor("#F8FAFC"))
                        maxLines = 2
                        setPadding(dp(4), dp(2), dp(4), dp(2))
                    }, LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        LinearLayout.LayoutParams.WRAP_CONTENT
                    ))
                }
            }

            val wSpec = android.view.View.MeasureSpec.makeMeasureSpec(
                imageWidthPx, android.view.View.MeasureSpec.EXACTLY
            )
            val hSpec = android.view.View.MeasureSpec.makeMeasureSpec(
                0, android.view.View.MeasureSpec.UNSPECIFIED
            )
            outer.measure(wSpec, hSpec)
            val height = outer.measuredHeight.coerceAtLeast(dp(1))
            outer.layout(0, 0, imageWidthPx, height)
            val bmp = Bitmap.createBitmap(imageWidthPx, height, Bitmap.Config.ARGB_8888)
            outer.draw(Canvas(bmp))
            bmp
        } catch (_: Exception) { null }
    }

'''
              s = s.replace(anchor, method + anchor, 1)
          p.write_text(s)

          # ── TripReader: endereços mais robustos + BigPicture da oferta ──
          p = Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt')
          s = p.read_text()
          start_marker = '        // endereços: a linha logo depois de uma "perna" (tempo+distância)'
          ret_marker = '        return Offer(valor, km, min, rkmDirect, nota, origem, destino'
          start = s.index(start_marker)
          end = s.index(ret_marker, start)
          new_addr = r'''        // Endereços da oferta. A leitura anterior só procurava até 3 linhas
        // depois de cada perna; na 99 o endereço pode aparecer mais abaixo ou
        // dividido em duas linhas. Mantemos a busca ancorada no bloco da oferta
        // para não misturar endereço da navegação que esteja por trás do card.
        fun cleanAddress(raw: String): String = raw
            .replace(Regex("""^[•·]\s*"""), "")
            .trim()

        fun looksLikeAddress(raw: String): Boolean {
            val sl = cleanAddress(raw).lowercase(Locale.getDefault())
            if (sl.length < 6) return false
            if (sl.contains("parada") && !Regex("""\b(rua|r\.?|av\.?|avenida|estrada|travessa|alameda|rodovia|pra[çc]a|largo|ladeira|rod\.?|via)\b""", RegexOption.IGNORE_CASE).containsMatchIn(sl)) return false
            if (sl.contains("não afeta") || sl.contains("nao afeta")) return false
            if (Regex("""^\(?\d{1,3}([.,]\d+)?\s*(min|km|m)\b""").containsMatchIn(sl)) return false
            if (Regex("""^[x%\d.,\s]+$""").containsMatchIn(sl)) return false
            if (sl.contains("r$") || sl.contains("tarifa") || sl.contains("taxa de espera")) return false
            if (sl.contains("espera longa") || sl.contains("perfil essencial") || sl.contains("perfil premium") || sl.contains("perfil prata")) return false
            if (sl == "online" || sl == "buscando" || sl == "offline" || sl == "conectar") return false
            if (sl.contains("pgto. no app") || sl == "dinheiro" || sl == "negocia" || sl == "qr code") return false
            if (Regex("""[1-5][.,]\d{2}.{0,15}corrid""").containsMatchIn(sl)) return false
            if (sl.contains("verif.") || sl.contains("cpf e cart")) return false
            val street = Regex("""\b(rua|r\.?|av\.?|avenida|estrada|travessa|alameda|rodovia|pra[çc]a|largo|ladeira|rod\.?|via\b)""", RegexOption.IGNORE_CASE).containsMatchIn(sl)
            val numbered = Regex("""[^\d],\s*\d{1,5}\b""").containsMatchIn(sl)
            return street || numbered
        }

        fun normalizedAddress(raw: String): String = cleanAddress(raw)
            .lowercase(Locale.getDefault())
            .replace(Regex("""[\s,.;:–—-]+"""), " ")
            .trim()

        fun candidateAt(index: Int): String? {
            if (index !in texts.indices) return null
            val cur = cleanAddress(texts[index])
            val curLow = cur.lowercase(Locale.getDefault())
            val hasStreet = Regex("""\b(rua|r\.?|av\.?|avenida|estrada|travessa|alameda|rodovia|pra[çc]a|largo|ladeira|rod\.?|via\b)""", RegexOption.IGNORE_CASE).containsMatchIn(curLow)
            val hasNumber = Regex("""[^\d],\s*\d{1,5}\b""").containsMatchIn(curLow)
            if (hasStreet && !hasNumber && index + 1 in texts.indices) {
                val next = cleanAddress(texts[index + 1])
                if (Regex("""^\d{1,5}\b""").containsMatchIn(next) || Regex("""^[,;:\-–—]\s*\d{1,5}\b""").containsMatchIn(next)) {
                    val combined = "$cur $next"
                    if (looksLikeAddress(combined)) return combined
                }
            }
            return cur.takeIf { looksLikeAddress(it) }
        }

        val legLineRe = Regex("""^\(?\s*\d{1,3}\s*min(?:utos)?""", RegexOption.IGNORE_CASE)
        val legIndexes = texts.indices.filter { legLineRe.containsMatchIn(texts[it]) }
        val blockStart = legIndexes.firstOrNull() ?: 0
        val actionIndex = ((blockStart + 1) until texts.size).firstOrNull { i ->
            val l = texts[i].lowercase(Locale.getDefault())
            l.contains("aceitar") || l.contains("selecionar") || l.contains("escolher")
        }
        val blockEnd = actionIndex ?: minOf(texts.size - 1, blockStart + 20)

        val indexed = ArrayList<Pair<Int, String>>()
        fun addIndexed(i: Int, value: String?) {
            val v = value?.let(::cleanAddress)?.takeIf { looksLikeAddress(it) } ?: return
            val norm = normalizedAddress(v)
            if (indexed.none { normalizedAddress(it.second) == norm }) indexed.add(i to v)
        }

        // Primeiro procura perto de cada perna, mas com uma janela maior.
        legIndexes.forEachIndexed { pos, legIdx ->
            val nextLeg = legIndexes.getOrNull(pos + 1)
            val scanEnd = minOf(nextLeg?.minus(1) ?: blockEnd, legIdx + 7, blockEnd)
            if (legIdx + 1 <= scanEnd) {
                for (j in (legIdx + 1)..scanEnd) {
                    val c = candidateAt(j)
                    if (c != null) { addIndexed(j, c); break }
                }
            }
        }

        var labeledOrigin: String? = null
        var labeledDest: String? = null
        val labeledStops = ArrayList<String>()
        fun labeledTail(line: String, labels: List<String>): String? {
            val lowLine = line.lowercase(Locale.getDefault())
            for (label in labels) {
                val idx = lowLine.indexOf(label)
                if (idx >= 0) {
                    val tail = cleanAddress(line.substring(idx + label.length).trimStart(':', '-', '–', '—', ' '))
                    if (looksLikeAddress(tail)) return tail
                }
            }
            return null
        }

        // Se uma perna não expôs o endereço nas linhas imediatamente seguintes,
        // completa usando apenas candidatos dentro do bloco da oferta.
        if (blockStart <= blockEnd) {
            for (i in blockStart..blockEnd) {
                val line = texts[i]
                if (labeledOrigin == null) labeledOrigin = labeledTail(line, listOf("origem", "embarque", "buscar em", "pickup"))
                if (labeledDest == null) labeledDest = labeledTail(line, listOf("destino", "desembarque", "dropoff", "para"))
                Regex("""(?i)(?:parada\s*\d+|\d+[ªa]?\s*parada)\s*[:\-–—]\s*(.+)$""").find(line)
                    ?.groupValues?.getOrNull(1)?.let { if (looksLikeAddress(it)) labeledStops.add(cleanAddress(it)) }
                addIndexed(i, candidateAt(i))
            }
        }

        val ordered = indexed.sortedBy { it.first }.map { it.second }.fold(ArrayList<String>()) { acc, v ->
            val n = normalizedAddress(v)
            if (acc.none { normalizedAddress(it) == n }) acc.add(v)
            acc
        }
        val origem = labeledOrigin ?: ordered.firstOrNull()
        val destino = labeledDest ?: ordered.lastOrNull()?.takeIf { origem == null || normalizedAddress(it) != normalizedAddress(origem) }
        val stopAddresses = if (labeledStops.isNotEmpty()) {
            labeledStops.distinctBy(::normalizedAddress).take(paradas.coerceAtLeast(labeledStops.size))
        } else if (paradas > 0) {
            ordered.filter { a ->
                (origem == null || normalizedAddress(a) != normalizedAddress(origem)) &&
                (destino == null || normalizedAddress(a) != normalizedAddress(destino))
            }.take(paradas)
        } else emptyList()

'''
          s = s[:start] + new_addr + s[end:]

          # Atualiza a chave da notificação conforme os dados refinam.
          old_key = '''        val key = listOf(
            plat, offer.valor?.toString() ?: "", origem ?: "", destino ?: "",
            stops.joinToString("|"), overallGrade, declineReason ?: ""
        ).joinToString("|")'''
          new_key = '''        val key = listOf(
            plat, offer.valor?.toString() ?: "", origem ?: "", destino ?: "",
            stops.joinToString("|"), overallGrade, declineReason ?: "",
            offer.minPickup?.toString() ?: "", offer.kmPickup?.toString() ?: "",
            offer.minTrip?.toString() ?: "", offer.kmTrip?.toString() ?: "",
            metrics.joinToString("|") { "${it.label}:${it.value}:${it.grade}" }
        ).joinToString("|")'''
          assert old_key in s, 'notification key block missing'
          s = s.replace(old_key, new_key, 1)
          s = s.replace('        if (origem == null && destino == null && stops.isEmpty()) return\n\n', '', 1)

          old_style = '''        builder.setContentTitle(titulo)
            .setStyle(Notification.BigTextStyle().bigText(resumo))
            .setContentText(lines.firstOrNull() ?: titulo)'''
          new_style = '''        val picture = flashCard.renderNotificationBitmap(
            plat, overallGrade, metrics, offer.min ?: 0, offer.km ?: 0.0,
            declineReason, lines
        )
        builder.setContentTitle(titulo)
            .setContentText(lines.firstOrNull() ?: titulo)'''
          assert old_style in s, 'notification style block missing'
          s = s.replace(old_style, new_style, 1)
          style_anchor = '''            .setAutoCancel(false)
            .setOngoing(false)'''
          style_repl = '''            .setAutoCancel(false)
            .setOngoing(false)
        if (picture != null) {
            builder.setStyle(Notification.BigPictureStyle()
                .bigPicture(picture)
                .setBigContentTitle(titulo)
                .setSummaryText(lines.take(2).joinToString(" · ")))
        } else {
            builder.setStyle(Notification.BigTextStyle().bigText(resumo))
        }'''
          assert style_anchor in s, 'notification tail block missing'
          s = s.replace(style_anchor, style_repl, 1)
          p.write_text(s)

          # ── Notificações oficiais: endereços sem depender de Rua/Av. ──
          p = Path('app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt')
          s = p.read_text()
          start = s.index('    private fun extractRouteInfo(parts: List<String>, mins: List<Int>): RouteInfo {')
          end = s.index('\n    private fun hash(', start)
          new_fn = r'''    private fun extractRouteInfo(parts: List<String>, mins: List<Int>): RouteInfo {
        val cleaned = parts.flatMap { it.split('\n') }
            .map { it.replace(Regex("\\s+"), " ").trim() }
            .filter { it.isNotBlank() }

        fun looksLikeAddress(raw: String): Boolean {
            val line = raw.trim()
            val low = line.lowercase(Locale("pt", "BR"))
            if (line.length < 6 || low.contains("r$")) return false
            if (Regex("""^\d{1,3}(?:[.,]\d+)?\s*(km|m|min)\b""", RegexOption.IGNORE_CASE).containsMatchIn(low)) return false
            val street = Regex("""\b(rua|r\.?|av\.?|avenida|estrada|travessa|alameda|rodovia|pra[çc]a|largo|ladeira|via)\b""", RegexOption.IGNORE_CASE).containsMatchIn(low)
            val numbered = Regex("""[^\d],\s*\d{1,5}\b""").containsMatchIn(low)
            return street || numbered
        }
        fun norm(raw: String) = raw.lowercase(Locale("pt", "BR")).replace(Regex("""[\s,.;:–—-]+"""), " ").trim()
        fun valueAfterLabel(line: String, labels: List<String>): String? {
            val low = line.lowercase(Locale("pt", "BR"))
            for (label in labels) {
                val i = low.indexOf(label)
                if (i >= 0) {
                    val tail = line.substring(i + label.length).trim().trimStart(':', '-', '–', '—').trim()
                    if (looksLikeAddress(tail)) return tail
                }
            }
            return null
        }
        val originLabels = listOf("origem", "embarque", "buscar em", "pickup")
        val destLabels = listOf("destino", "desembarque", "dropoff", "para")
        var origin: String? = null
        var dest: String? = null
        val stops = ArrayList<String>()
        var declaredStops = 0
        cleaned.forEach { line ->
            Regex("""\b(\d{1,2})\s*paradas?\b""", RegexOption.IGNORE_CASE).find(line)?.let {
                declaredStops = maxOf(declaredStops, it.groupValues[1].toIntOrNull() ?: 0)
            }
            if (origin == null) origin = valueAfterLabel(line, originLabels)
            if (dest == null) dest = valueAfterLabel(line, destLabels)
            Regex("""(?i)(?:parada\s*\d+|\d+[ªa]?\s*parada)\s*[:\-–—]\s*(.+)$""").find(line)?.groupValues?.getOrNull(1)?.trim()?.let {
                if (looksLikeAddress(it)) stops.add(it)
            }
        }
        val routeCandidates = cleaned.filter(::looksLikeAddress).distinctBy(::norm)
        if (origin == null) origin = routeCandidates.firstOrNull()
        if (dest == null && routeCandidates.size >= 2) dest = routeCandidates.lastOrNull()
        if (stops.isEmpty() && declaredStops > 0 && routeCandidates.size > 2) {
            stops.addAll(routeCandidates.subList(1, routeCandidates.size - 1).take(declaredStops))
        }
        return RouteInfo(origin, dest, maxOf(declaredStops, stops.size), stops.distinctBy(::norm), mins.lastOrNull()?.times(60))
    }
'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)

          # Versão
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace('// 1.3.12: checklist completo de permissões + alerta preventivo antes das ofertas.', '// 1.3.13: imagem do Flash na notificação + leitura robusta de origem/destino/paradas.')
          s = s.replace('versionCode 225', 'versionCode 226')
          s = s.replace('versionName "1.3.12"', 'versionName "1.3.13"')
          p.write_text(s)
          PY
      - name: Compile
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt app/build.gradle
          git rm .github/workflows/finalize-flash-notification-v113.yml
          git commit -m 'fix: completar notificação visual e endereços no Flash 1.3.13'
          git push
