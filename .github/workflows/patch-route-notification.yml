name: Patch route notification 1.3.10
on:
  push:
    branches:
      - route-notification-1-3-10
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: route-notification-1-3-10
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Apply patch
        run: python3 .github/scripts/patch_route_1310.py
      - name: Validate patch
        run: |
          grep -q 'versionCode 223' app/build.gradle
          grep -q 'versionName "1.3.10"' app/build.gradle
          grep -q 'stop_addresses' app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'route_duration_sec' app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt
          grep -q 'MōB Flash — rota da corrida' app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt
      - name: Setup Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses 2>/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platforms;android-34" "build-tools;34.0.0" 2>/dev/null
          echo "sdk.dir=$SDK" > local.properties
      - name: Compile
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Commit validated changes
        run: |
          rm -f .github/workflows/patch-route-notification.yml .github/scripts/patch_route_1310.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rota completa e resultado Flash na notificacao 1.3.10'
          git push origin HEAD:route-notification-1-3-10
