name: Apply Route Notification 1.3.13
on:
  push:
    paths:
      - 'tools/patch_route_notification_v1313.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply patch
        run: python3 tools/patch_route_notification_v1313.py
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m 'fix: notificação com imagem e rota completa 1.3.13'
          git push
