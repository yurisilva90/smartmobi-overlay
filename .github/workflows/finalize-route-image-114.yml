name: Finalize Route Image 1.3.14
on:
  push:
    paths: ['.github/workflows/finalize-route-image-114.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch notification route and image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt')
          s=p.read_text()
          old='''        val parts = ArrayList<String>()
        listOf(title, text, big, sub, info, summary).filterTo(parts) { it.isNotBlank() }
        lines.filterTo(parts) { it.isNotBlank() }
        val joined = parts.joinToString(" ").replace(Regex("\\\\s+"), " ").trim()
'''
          new='''        // Junta também campos customizados internos da notificação. Uber/99
        // podem colocar rota/endereço em extras que não são EXTRA_TEXT/BIG_TEXT.
        // O conteúdo bruto continua só em memória: persistimos apenas os campos
        // estruturados extraídos (valor/km/min/origem/destino/paradas).
        val partSet = LinkedHashSet<String>()
        fun addPart(v: String?) { v?.trim()?.takeIf { it.isNotBlank() }?.let { partSet.add(it) } }
        listOf(title, text, big, sub, info, summary).forEach(::addPart)
        lines.forEach(::addPart)
        fun collectExtra(value: Any?, depth: Int = 0) {
            if (value == null || depth > 2) return
            when (value) {
                is CharSequence -> addPart(value.toString())
                is android.os.Bundle -> try { value.keySet().forEach { k -> collectExtra(value.get(k), depth + 1) } } catch (_: Exception) {}
                is Array<*> -> value.forEach { collectExtra(it, depth + 1) }
                is Iterable<*> -> value.forEach { collectExtra(it, depth + 1) }
            }
        }
        try { extras?.keySet()?.forEach { k -> collectExtra(extras.get(k)) } } catch (_: Exception) {}
        val parts = ArrayList(partSet)
        val joined = parts.joinToString(" ").replace(Regex("\\\\s+"), " ").trim()
'''
          assert old in s, 'bloco parts não encontrado'
          s=s.replace(old,new,1)

          old2='''        fun valueAfterLabel(line: String, labels: List<String>): String? {
            val low = line.lowercase(Locale("pt", "BR"))
            for (label in labels) {
                val i = low.indexOf(label)
                if (i >= 0) {
                    val tail = line.substring(i + label.length).trim().trimStart(':', '-', '–', '—').trim()
                    if (looksLikeAddress(tail)) return tail
                }
            }
            return null
        }
'''
          new2='''        fun looksLikeLabeledPlace(raw: String): Boolean {
            val line = raw.trim()
            val low = line.lowercase(Locale("pt", "BR"))
            if (line.length < 4 || low.contains("r$")) return false
            if (Regex("""^\\d{1,3}(?:[.,]\\d+)?\\s*(km|m|min)\\b""", RegexOption.IGNORE_CASE).containsMatchIn(low)) return false
            if (low.contains("aceitar") || low.contains("recusar") || low.contains("corrida disponível")) return false
            if (low in setOf("origem","destino","embarque","desembarque","pickup","dropoff","para")) return false
            return line.any { it.isLetter() }
        }
        fun valueAfterLabel(line: String, labels: List<String>): String? {
            val low = line.lowercase(Locale("pt", "BR"))
            for (label in labels) {
                val i = low.indexOf(label)
                if (i >= 0) {
                    val tail = line.substring(i + label.length).trim().trimStart(':', '-', '–', '—').trim()
                    if (looksLikeLabeledPlace(tail)) return tail
                }
            }
            return null
        }
'''
          assert old2 in s, 'valueAfterLabel não encontrado'
          s=s.replace(old2,new2,1)

          old3='''        cleaned.forEach { line ->
            Regex("""\\b(\\d{1,2})\\s*paradas?\\b""", RegexOption.IGNORE_CASE).find(line)?.let {
                declaredStops = maxOf(declaredStops, it.groupValues[1].toIntOrNull() ?: 0)
            }
            if (origin == null) origin = valueAfterLabel(line, originLabels)
            if (dest == null) dest = valueAfterLabel(line, destLabels)
            Regex("""(?i)(?:parada\\s*\\d+|\\d+[ªa]?\\s*parada)\\s*[:\\-–—]\\s*(.+)$""")
                .find(line)?.groupValues?.getOrNull(1)?.trim()?.let {
                    if (looksLikeAddress(it)) stops.add(it)
                }
        }
'''
          new3='''        cleaned.forEachIndexed { idx, line ->
            Regex("""\\b(\\d{1,2})\\s*paradas?\\b""", RegexOption.IGNORE_CASE).find(line)?.let {
                declaredStops = maxOf(declaredStops, it.groupValues[1].toIntOrNull() ?: 0)
            }
            if (origin == null) origin = valueAfterLabel(line, originLabels)
            if (dest == null) dest = valueAfterLabel(line, destLabels)
            val bare = line.lowercase(Locale("pt", "BR")).trim().trimEnd(':')
            val next = cleaned.getOrNull(idx + 1)
            if (origin == null && originLabels.any { bare == it } && next != null && looksLikeLabeledPlace(next)) origin = next
            if (dest == null && destLabels.any { bare == it } && next != null && looksLikeLabeledPlace(next)) dest = next
            Regex("""(?i)(?:parada\\s*\\d+|\\d+[ªa]?\\s*parada)\\s*[:\\-–—]\\s*(.+)$""")
                .find(line)?.groupValues?.getOrNull(1)?.trim()?.let {
                    if (looksLikeLabeledPlace(it)) stops.add(it)
                }
            if (Regex("""(?i)^(?:parada\\s*\\d+|\\d+[ªa]?\\s*parada):?$""").matches(line.trim()) && next != null && looksLikeLabeledPlace(next)) {
                stops.add(next)
            }
        }
'''
          assert old3 in s, 'loop route não encontrado'
          s=s.replace(old3,new3,1)
          p.write_text(s)

          t=Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt')
          q=t.read_text()
          old4='''        if (flashPicture != null) {
            builder.setStyle(Notification.BigPictureStyle()
                .bigPicture(flashPicture)
                .setBigContentTitle(titulo)
                .setSummaryText(lines.take(2).joinToString(" · ")))
        } else {
'''
          new4='''        if (flashPicture != null) {
            // BigPicture mostra o card completo ao expandir. A miniatura força
            // uma referência visual do Flash também no estado recolhido em
            // aparelhos Samsung/One UI que escondem a imagem grande até expandir.
            val thumbW = 192
            val thumbH = ((flashPicture.height.toDouble() / flashPicture.width.coerceAtLeast(1)) * thumbW).toInt().coerceIn(96, 192)
            val flashThumb = try { Bitmap.createScaledBitmap(flashPicture, thumbW, thumbH, true) } catch (_: Exception) { null }
            if (flashThumb != null) builder.setLargeIcon(flashThumb)
            builder.setStyle(Notification.BigPictureStyle()
                .bigPicture(flashPicture)
                .setBigContentTitle(titulo)
                .setSummaryText(lines.take(2).joinToString(" · ")))
        } else {
'''
          assert old4 in q, 'BigPicture block não encontrado'
          q=q.replace(old4,new4,1)

          # OCR: aceita endereço brasileiro com bairro/cidade separado por hífen,
          # mesmo quando o OCR não trouxe "Rua/Av." nem número explícito.
          old5='''            val numbered = Regex("""[^\\d],\\s*\\d{1,5}\\b""").containsMatchIn(sl)
            return street || numbered
'''
          new5='''            val numbered = Regex("""[^\\d],\\s*\\d{1,5}\\b""").containsMatchIn(sl)
            val placeWithSeparator = sl.contains(" - ") && sl.count { it.isLetter() } >= 5
            return street || numbered || placeWithSeparator
'''
          assert old5 in q, 'looksLikeAddress OCR não encontrado'
          q=q.replace(old5,new5,1)
          t.write_text(q)
          PY
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin --no-daemon
      - name: Commit clean result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt
          git rm -f .github/workflows/finalize-route-image-114.yml .github/workflows/inspect-route-notification.yml _route_notification_snippet.txt _route_notification_function.txt _offer_parser_function.txt _flash_bitmap_function.txt
          git commit -m 'fix: finalizar imagem e endereços da notificação 1.3.14'
          git push
