name: Patch MoB 1.3.22 notification layout
on:
  push:
    paths:
      - '.github/workflows/patch-1.3.22.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.3.22 patch
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) FlashCard: notification image = ONLY the bounded colored card.
          p = Path('app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt')
          s = p.read_text()
          start = s.index('    fun renderNotificationBitmap(')
          brace = s.index('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          assert end is not None
          new_fn = r'''    fun renderNotificationBitmap(
              platform: String,
              offerValueText: String?,
              overallGrade: String,
              metrics: List<Metric>,
              totalMin: Int,
              totalKm: Double,
              declineReason: String? = null,
              detailLines: List<String> = emptyList()
          ): Bitmap? {
              fun renderNow(): Bitmap? {
                  return try {
                      val cardWidthPx = widthFor(metrics.size)
                      val card = buildCard(
                          platform, overallGrade, metrics, totalMin, totalKm,
                          cardWidthPx, declineReason
                      )
                      val wSpec = android.view.View.MeasureSpec.makeMeasureSpec(
                          cardWidthPx, android.view.View.MeasureSpec.EXACTLY
                      )
                      val hSpec = android.view.View.MeasureSpec.makeMeasureSpec(
                          0, android.view.View.MeasureSpec.UNSPECIFIED
                      )
                      card.measure(wSpec, hSpec)
                      val height = card.measuredHeight.coerceAtLeast(dp(1))
                      card.layout(0, 0, cardWidthPx, height)
                      Bitmap.createBitmap(cardWidthPx, height, Bitmap.Config.ARGB_8888).also { bmp ->
                          card.draw(Canvas(bmp))
                      }
                  } catch (_: Exception) { null }
              }

              if (Looper.myLooper() == Looper.getMainLooper()) return renderNow()
              var result: Bitmap? = null
              val latch = CountDownLatch(1)
              handler.post {
                  try { result = renderNow() } finally { latch.countDown() }
              }
              return try {
                  if (latch.await(1200, TimeUnit.MILLISECONDS)) result else null
              } catch (_: Exception) { null }
          }'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)

          # 2) TripReaderService: compact = 2 lines; expanded = title, total, origin/dest + card-only image.
          p = Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt')
          s = p.read_text()
          start = s.index('    private fun showRouteNotification(')
          brace = s.index('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          assert end is not None
          new_fn = r'''    private fun showRouteNotification(
              plat: String,
              offer: Offer,
              overallGrade: String,
              metrics: List<FlashCard.Metric>,
              declineReason: String?
          ) {
              val origem = offer.origem
              val destino = offer.destino
              val totalMin = offer.min ?: listOfNotNull(offer.minPickup, offer.minTrip).sum().takeIf { it > 0 }
              val totalKm = offer.km ?: listOfNotNull(offer.kmPickup, offer.kmTrip).sum().takeIf { it > 0.0 }
              val key = listOf(
                  plat, offer.valor?.toString() ?: "", origem ?: "", destino ?: "",
                  overallGrade, declineReason ?: "", totalMin?.toString() ?: "",
                  totalKm?.toString() ?: "", metrics.joinToString("|") { "${it.label}:${it.value}:${it.grade}" }
              ).joinToString("|")
              if (key == lastNotifKey) return
              lastNotifKey = key

              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm.getNotificationChannel(NOTIF_CHANNEL_ROUTE) == null) {
                  val ch = NotificationChannel(
                      NOTIF_CHANNEL_ROUTE, "MōB Flash — rota da corrida",
                      NotificationManager.IMPORTANCE_LOW
                  )
                  ch.description = "Resumo silencioso da oferta e resultado do MōB Flash"
                  ch.setSound(null, null); ch.enableVibration(false); ch.enableLights(false)
                  nm.createNotificationChannel(ch)
              }

              fun mapIntent(addr: String): PendingIntent {
                  val geoUri = Uri.parse("geo:0,0?q=" + Uri.encode(addr))
                  val maps = Intent(Intent.ACTION_VIEW, geoUri).apply { setPackage("com.google.android.apps.maps") }
                  val generic = Intent(Intent.ACTION_VIEW, geoUri)
                  val real = if (maps.resolveActivity(packageManager) != null) maps else generic
                  return PendingIntent.getActivity(
                      this, addr.hashCode(), real,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
              }

              val valorTxt = offer.valor?.let { "R$ ${fmtBr(it)}" }
              val platLabel = if (plat.equals("UBER", true)) "Uber" else "99"
              val titulo = listOfNotNull(platLabel, valorTxt).joinToString(" - ")
              val resumoLinha = listOfNotNull(
                  totalKm?.let { "${fmtBr(it)} km" },
                  totalMin?.let { "${it}m" }
              ).joinToString(" - ")
              val enderecoResumo = listOfNotNull(
                  origem?.let { "Origem: $it" },
                  destino?.let { "Destino: $it" }
              ).joinToString("\n")

              val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                  Notification.Builder(this, NOTIF_CHANNEL_ROUTE)
              } else {
                  @Suppress("DEPRECATION") Notification.Builder(this)
              }
              val flashPicture = flashCard.renderNotificationBitmap(
                  plat, valorTxt, overallGrade, metrics, totalMin ?: 0,
                  totalKm ?: 0.0, declineReason, emptyList()
              )
              builder.setContentTitle(titulo)
                  .setContentText(resumoLinha)
                  .setSmallIcon(R.mipmap.ic_launcher)
                  .setPriority(Notification.PRIORITY_LOW)
                  .setOnlyAlertOnce(true)
                  .setAutoCancel(false)
                  .setOngoing(false)

              if (flashPicture != null) {
                  builder.setStyle(
                      Notification.BigPictureStyle()
                          .bigPicture(flashPicture)
                          .setBigContentTitle("$titulo\n$resumoLinha")
                          .setSummaryText(enderecoResumo)
                  )
              } else if (enderecoResumo.isNotBlank()) {
                  builder.setStyle(Notification.BigTextStyle().bigText("$resumoLinha\n$enderecoResumo"))
              }
              if (origem != null) builder.addAction(Notification.Action.Builder(null, "Origem", mapIntent(origem)).build())
              if (destino != null) builder.addAction(Notification.Action.Builder(null, "Destino", mapIntent(destino)).build())
              try { nm.notify(4103, builder.build()) } catch (_: Exception) {}
          }'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)

          # 3) version bump
          p = Path('app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+234', 'versionCode 235', s)
          s = re.sub(r'versionName\s+"1\.3\.21"', 'versionName "1.3.22"', s)
          s = re.sub(r'// 1\.3\.21:.*', '// 1.3.22: notificação compacta 2 linhas + imagem somente do card.', s)
          s = s.replace('// build trigger v1.3.21', '// build trigger v1.3.22')
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Yuri Silva"
          git config user.email "yurisilva1990@gmail.com"
          git add app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m "MoB 1.3.22 notification layout" || exit 0
          git push
