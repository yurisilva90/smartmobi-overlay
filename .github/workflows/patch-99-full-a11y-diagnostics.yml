name: Patch 99 full accessibility diagnostics
on:
  push:
    paths:
      - '.github/workflows/patch-99-full-a11y-diagnostics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 99 diagnostic patch
        run: python3 scripts/patch_99_full_a11y.py
      - name: Commit 99 diagnostic patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m "Capture full 99 accessibility diagnostics"
          git push
