name: Patch Flash 1.3.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-flash-137.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Flash stabilization patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          trip = Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt')
          s = trip.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique ({text.count(old)}): {label}')
              return text.replace(old, new, 1)

          # Estado visual estável por oferta: primeira leitura aparece na hora,
          # apenas melhoria clara entra por ~1s; depois congela.
          anchor = '    private val bestLegsForOfferByPlat = HashMap<String, Int>()\n'
          insert = anchor + '''    // Flash 1.3.7: identidade visual estável da oferta. O OCR pode reler a\n    // mesma tela várias vezes por segundo; essas releituras refinam a primeira\n    // somente numa janela curta e nunca reabrem/re-falam a mesma oferta.\n    private data class VisualOfferState(\n        val platform: String,\n        var offer: Offer,\n        val firstSeenMs: Long,\n        val token: String\n    )\n    private var visualOfferState: VisualOfferState? = null\n    private var pendingNewOfferValue: Double? = null\n    private var pendingNewOfferCount = 0\n    private val OFFER_REFINE_WINDOW_MS = 950L\n    private val OFFER_NEW_VALUE_CONFIRMATIONS = 2\n\n    private fun offerQualityScore(o: Offer): Int {\n        var score = o.legsFound * 4\n        if (o.km != null) score += 1\n        if (o.min != null) score += 1\n        if (o.rkmDirect != null) score += 1\n        if (o.nota != null) score += 1\n        if (o.corridas != null) score += 2\n        if (o.origem != null) score += 1\n        if (o.destino != null) score += 1\n        return score\n    }\n\n    private fun isClearlyBetterOffer(candidate: Offer, current: Offer): Boolean {\n        // Nunca troca uma leitura de 2 pernas por uma de 1 perna. A melhora\n        // precisa acrescentar informação de verdade (2ª perna, nota+contagem,\n        // endereço etc.), não apenas oscilar um número do OCR.\n        if (candidate.legsFound < current.legsFound) return false\n        return offerQualityScore(candidate) > offerQualityScore(current)\n    }\n'''
          s = replace_once(s, anchor, insert, 'visual offer state')

          # Piso absoluto do valor principal: corrida real nunca é < R$5.
          old = '''        Regex("""aceitar por\\s*r\\$\\s*([\\d.]+,\\d{2})""").find(low)?.let {\n            valor = moneyToDouble(it.groupValues[1])\n        }\n'''
          new = '''        Regex("""aceitar por\\s*r\\$\\s*([\\d.]+,\\d{2})""").find(low)?.let {\n            val parsed = moneyToDouble(it.groupValues[1])\n            if (parsed != null && parsed >= 5.0) valor = parsed\n        }\n'''
          s = replace_once(s, old, new, 'anchored fare floor')

          old = '''            val dinamicoValues = listOfNotNull(\n                dinamicoBase.takeIf { it > 0 }, dinamicoEspera.takeIf { it > 0 },\n                dinamicoEmbarque.takeIf { it > 0 }, dinamicoDeslocamento.takeIf { it > 0 }\n            )\n            val monies = extractMoney(joined).mapNotNull { moneyToDouble(it) }.filter { it > 0 }\n'''
          new = '''            val dinamicoValues = listOfNotNull(\n                dinamicoBase.takeIf { it > 0 }, dinamicoEspera.takeIf { it > 0 },\n                dinamicoEmbarque.takeIf { it > 0 }, dinamicoDeslocamento.takeIf { it > 0 },\n                dinamicoUber.takeIf { it > 0 }\n            )\n            // Piso absoluto aprovado: nenhum candidato abaixo de R$5 pode ser\n            // valor total da corrida. Esses números continuam disponíveis como\n            // dinâmico/adicional, mas não competem com a tarifa principal.\n            val monies = extractMoney(joined).mapNotNull { moneyToDouble(it) }.filter { it >= 5.0 }\n'''
          s = replace_once(s, old, new, 'fallback fare candidates')

          old = '''        // fallback de km: valor / rkm direto\n        if (km == null && valor != null && rkmDirect != null && rkmDirect > 0) {\n'''
          new = '''        // Rede final: mesmo que algum caminho novo de parser seja adicionado\n        // no futuro, valor abaixo do piso nunca escapa como tarifa principal.\n        if (valor != null && valor!! < 5.0) valor = null\n\n        // fallback de km: valor / rkm direto\n        if (km == null && valor != null && rkmDirect != null && rkmDirect > 0) {\n'''
          s = replace_once(s, old, new, 'final fare floor')

          s = replace_once(
              s,
              '        if (valor == null || valor <= 0.0 || valor > 2000.0 || km == null || km <= 0.0 || km > 150.0) {\n',
              '        if (valor == null || valor < 5.0 || valor > 2000.0 || km == null || km <= 0.0 || km > 150.0) {\n',
              'process fare floor'
          )

          # Troca a assinatura mutável (valor/km/min/nota) por identidade da oferta.
          start_marker = '        // A mesma oferta (mesmo valor, MESMA PLATAFORMA) não pode "regredir"\n'
          end_marker = '        lastFlashSigSetMs = System.currentTimeMillis()\n'
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('visual gate start not found')
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('visual gate end not found')
          end += len(end_marker)
          gate = '''        // Flash 1.3.7 — primeira leitura como base. A mesma oferta não muda\n        // indefinidamente conforme o OCR oscila. Por 950ms aceitamos somente\n        // uma leitura CLARAMENTE mais completa; depois o card fica congelado.\n        // Se surgir outro valor sem a tela ter ficado vazia, exige 2 leituras\n        // consecutivas desse novo valor para separar oferta nova de ruído.\n        val nowVisual = System.currentTimeMillis()\n        val activeVisual = visualOfferState\n        var visualChanged = false\n\n        fun startVisualOffer() {\n            val token = "$plat|$nowVisual|${(valor * 100.0).toInt()}"\n            visualOfferState = VisualOfferState(plat, offer, nowVisual, token)\n            pendingNewOfferValue = null\n            pendingNewOfferCount = 0\n            lastFlashSig = token\n            lastFlashSigSetMs = nowVisual\n            visualChanged = true\n        }\n\n        if (activeVisual == null || lastFlashSig.isEmpty()) {\n            startVisualOffer()\n        } else if (activeVisual.platform != plat) {\n            // Troca real de app/plataforma é uma oferta nova inequívoca.\n            startVisualOffer()\n        } else {\n            val activeValue = activeVisual.offer.valor ?: valor\n            val sameValue = kotlin.math.abs(valor - activeValue) < 0.02\n            if (sameValue) {\n                pendingNewOfferValue = null\n                pendingNewOfferCount = 0\n                if (nowVisual - activeVisual.firstSeenMs <= OFFER_REFINE_WINDOW_MS &&\n                    isClearlyBetterOffer(offer, activeVisual.offer)) {\n                    activeVisual.offer = offer\n                    visualChanged = true\n                }\n            } else {\n                val pending = pendingNewOfferValue\n                if (pending != null && kotlin.math.abs(valor - pending) < 0.02) {\n                    pendingNewOfferCount++\n                } else {\n                    pendingNewOfferValue = valor\n                    pendingNewOfferCount = 1\n                }\n                if (pendingNewOfferCount >= OFFER_NEW_VALUE_CONFIRMATIONS) {\n                    startVisualOffer()\n                }\n            }\n        }\n\n        if (!visualChanged) {\n            // A oferta continua na tela, então apenas renova o auto-hide; não\n            // redesenha, não salva outro snapshot e principalmente não fala.\n            bmp?.recycle()\n            main.post { flashCard.keepAlive(15000L) }\n            return\n        }\n'''
          s = s[:start] + gate + s[end:]

          # Passa o token estável para o card/áudio.
          old = '''                declineReasonSpoken = declineReasonSpoken,\n                autoHideMs = 15000L\n'''
          new = '''                declineReasonSpoken = declineReasonSpoken,\n                offerToken = visualOfferState?.token,\n                autoHideMs = 15000L\n'''
          s = replace_once(s, old, new, 'offer token call')

          # Ao sumir a oferta, libera uma nova identidade.
          old = '''            lastOfferValorByPlat.clear()\n            bestLegsForOfferByPlat.clear()\n            main.post { flashCard.hide() }\n'''
          new = '''            lastOfferValorByPlat.clear()\n            bestLegsForOfferByPlat.clear()\n            visualOfferState = null\n            pendingNewOfferValue = null\n            pendingNewOfferCount = 0\n            main.post { flashCard.hide() }\n'''
          s = replace_once(s, old, new, 'reset visual offer')

          trip.write_text(s)

          # FlashCard: áudio é um único anúncio por token, ~1s depois da primeira
          # leitura. Se uma melhoria entrar dentro da janela, atualiza o conteúdo
          # pendente e a voz já fala o veredito refinado, uma vez só.
          flash = Path('app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt')
          f = flash.read_text()

          anchor = '    private var lastSpokenReason: String? = null\n'
          insert = anchor + '''    private var activeOfferToken: String? = null\n    private var pendingOfferSpeechGrade: String? = null\n    private var pendingOfferSpeechReason: String? = null\n    private var pendingOfferSpeechReasonSpoken: String? = null\n    private val OFFER_SPEECH_DELAY_MS = 1050L\n    private val offerSpeechRunnable = Runnable {\n        val grade = pendingOfferSpeechGrade ?: return@Runnable\n        val reason = pendingOfferSpeechReason\n        speakGrade(grade, pendingOfferSpeechReasonSpoken ?: reason)\n        lastSpokenGrade = grade\n        lastSpokenReason = reason\n    }\n'''
          f = replace_once(f, anchor, insert, 'speech token fields')

          old_sig = '    fun show(platform: String, overallGrade: String, metrics: List<Metric>, totalMin: Int, totalKm: Double, declineReason: String? = null, declineReasonShort: String? = null, declineReasonSpoken: String? = null, autoHideMs: Long = 20000L) {\n'
          new_sig = '    fun show(platform: String, overallGrade: String, metrics: List<Metric>, totalMin: Int, totalKm: Double, declineReason: String? = null, declineReasonShort: String? = null, declineReasonSpoken: String? = null, offerToken: String? = null, autoHideMs: Long = 20000L) {\n'
          f = replace_once(f, old_sig, new_sig, 'show signature')

          old = '''            val gradeChanged = overallGrade != lastSpokenGrade || declineReason != lastSpokenReason\n            if (wasHidden || gradeChanged) {\n                lastSpokenGrade = overallGrade\n                lastSpokenReason = declineReason\n                // CORRIGIDO (24/07/2026, pedido do Yuri): o texto do card\n                // junta vários motivos com "·" (ponto médio) — bonito no\n                // card, mas o motor de voz lê esse caractere como "ponto"\n                // em voz alta ("buscar longe ponto nota baixa"). Fala usa\n                // uma versão separada, com vírgula, que soa natural.\n                speakGrade(overallGrade, declineReasonSpoken ?: declineReason)\n            }\n'''
          new = '''            if (offerToken != null) {\n                // Uma oferta = uma fala. O card aparece na primeira leitura,\n                // mas a voz espera ~1s para a janela de refinamento terminar.\n                // Releituras da MESMA oferta apenas atualizam o veredito que\n                // está pendente; nunca criam uma segunda fala.\n                pendingOfferSpeechGrade = overallGrade\n                pendingOfferSpeechReason = declineReason\n                pendingOfferSpeechReasonSpoken = declineReasonSpoken ?: declineReason\n                if (offerToken != activeOfferToken) {\n                    handler.removeCallbacks(offerSpeechRunnable)\n                    activeOfferToken = offerToken\n                    handler.postDelayed(offerSpeechRunnable, OFFER_SPEECH_DELAY_MS)\n                }\n            } else {\n                // Compatibilidade para alertas/chamadas antigas sem token.\n                val gradeChanged = overallGrade != lastSpokenGrade || declineReason != lastSpokenReason\n                if (wasHidden || gradeChanged) {\n                    lastSpokenGrade = overallGrade\n                    lastSpokenReason = declineReason\n                    speakGrade(overallGrade, declineReasonSpoken ?: declineReason)\n                }\n            }\n'''
          f = replace_once(f, old, new, 'speech block')

          # keepAlive evita auto-hide enquanto a mesma oferta continua sendo lida,
          # sem precisar reconstruir o card.
          old = '''    fun hide() {\n        handler.removeCallbacks(hideRunnable)\n'''
          new = '''    fun keepAlive(autoHideMs: Long = 20000L) {\n        handler.removeCallbacks(hideRunnable)\n        if (container != null) handler.postDelayed(hideRunnable, autoHideMs)\n    }\n\n    fun hide() {\n        handler.removeCallbacks(hideRunnable)\n        handler.removeCallbacks(offerSpeechRunnable)\n'''
          f = replace_once(f, old, new, 'keepalive')

          old = '''            lastSpokenGrade = null\n            lastSpokenReason = null\n            lastShownSignature = ""\n'''
          new = '''            lastSpokenGrade = null\n            lastSpokenReason = null\n            activeOfferToken = null\n            pendingOfferSpeechGrade = null\n            pendingOfferSpeechReason = null\n            pendingOfferSpeechReasonSpoken = null\n            lastShownSignature = ""\n'''
          f = replace_once(f, old, new, 'speech reset')
          flash.write_text(f)

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          g = g.replace('// 1.3.6: persistência independente dos trechos Online/Buscar/Corrida da Jornada.', '// 1.3.7: Flash estável por oferta + piso absoluto de R$5 para tarifa principal.', 1)
          g = g.replace('versionCode 219', 'versionCode 220', 1)
          g = g.replace('versionName "1.3.6"', 'versionName "1.3.7"', 1)
          if 'versionCode 220' not in g or 'versionName "1.3.7"' not in g:
              raise SystemExit('version bump failed')
          gradle.write_text(g)
          PY

          git diff --check
          grep -q 'versionName "1.3.7"' app/build.gradle
          grep -q 'OFFER_REFINE_WINDOW_MS = 950L' app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt
          grep -q 'OFFER_SPEECH_DELAY_MS = 1050L' app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-flash-137.yml
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/src/main/java/io/github/yurisilva90/smartmobi/FlashCard.kt app/build.gradle
          git commit -m 'fix: estabiliza leitura de ofertas no MoB 1.3.7'
          git push origin main
