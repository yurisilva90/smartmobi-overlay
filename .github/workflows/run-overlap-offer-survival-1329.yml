name: Preservar oferta da próxima corrida
on:
  push:
    paths:
      - '.github/workflows/run-overlap-offer-survival-1329.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção da oferta sobreposta
        run: python3 .github/scripts/patch_overlap_offer_survive_previous_trip_1329.py
      - name: Validar código alterado
        run: |
          grep -q 'overlapOfferByPlat' app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'effectiveMaxAgeMs' app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'versionName "1.3.29"' app/build.gradle
          ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Gravar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt app/build.gradle
          git commit -m 'Keep overlapping offer until next trip acceptance'
          git push
