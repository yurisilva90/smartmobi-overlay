name: Apply Permission Bridge
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply patch
        run: python3 scripts/apply_permission_bridge.py
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/MainActivity.kt app/build.gradle
          git rm -f scripts/apply_permission_bridge.py .github/workflows/apply-permission-bridge.yml
          git commit -m "fix: completar checklist nativo de permissões"
          git push
