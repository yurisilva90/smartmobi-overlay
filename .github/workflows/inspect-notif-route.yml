name: Inspect notif route
on:
  push:
    paths: ['.github/workflows/inspect-notif-route.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt').read_text()
          out=[]
          for key in ['fun looksLikeAddress','private fun showRouteNotification','private fun parseOffer','val addrCandidates']:
              i=s.find(key)
              if i>=0:
                  out.append('\n===== '+key+' =====\n'+s[max(0,i-2500):min(len(s),i+12000)])
          Path('_notif_route_snippet.txt').write_text('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _notif_route_snippet.txt
          git commit -m 'chore: extrair trechos de rota e notificação'
          git push
