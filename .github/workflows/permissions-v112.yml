''','''    private fun isNotificationAccessEnabled(): Boolean = try {
        NotificationManagerCompat.getEnabledListenerPackages(this).contains(packageName)
    } catch (_: Exception) { false }

    private fun hasPreciseLocationPermission(): Boolean =
        ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED

    private fun hasBackgroundLocationPermission(): Boolean =
        Build.VERSION.SDK_INT < Build.VERSION_CODES.Q ||
            ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_BACKGROUND_LOCATION) == PackageManager.PERMISSION_GRANTED

    private fun isBatteryOptimizationExempt(): Boolean = try {
        Build.VERSION.SDK_INT < Build.VERSION_CODES.M ||
            (getSystemService(POWER_SERVICE) as PowerManager).isIgnoringBatteryOptimizations(packageName)
    } catch (_: Exception) { false }

    private fun hasPostNotificationsPermission(): Boolean =
        Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||
            ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED

    private fun emitNativeVideoJs(js: String) {
''','permission helpers')

          rep('''            @JavascriptInterface fun openNotificationAccessSettings() {
                runOnUiThread {
                    try { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) }
                    catch (_: Exception) { Toast.makeText(this@MainActivity, "Não foi possível abrir o acesso às notificações.", Toast.LENGTH_LONG).show() }
                }
            }

            // O WebView do Android 10 pode falhar ao decodificar alguns MP4.
''','''            @JavascriptInterface fun openNotificationAccessSettings() {
                runOnUiThread {
                    try { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) }
                    catch (_: Exception) { Toast.makeText(this@MainActivity, "Não foi possível abrir o acesso às notificações.", Toast.LENGTH_LONG).show() }
                }
            }

            // Pré-requisitos operacionais exibidos na tela do MōB Flash.
            @JavascriptInterface fun hasLocationPermission(): Boolean = this@MainActivity.hasPreciseLocationPermission()
            @JavascriptInterface fun hasBackgroundLocationPermission(): Boolean = this@MainActivity.hasBackgroundLocationPermission()
            @JavascriptInterface fun openLocationSettings() {
                runOnUiThread {
                    try {
                        if (!this@MainActivity.hasPreciseLocationPermission()) {
                            ActivityCompat.requestPermissions(
                                this@MainActivity,
                                arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION),
                                REQ_PERM
                            )
                        } else if (!this@MainActivity.hasBackgroundLocationPermission()) {
                            if (Build.VERSION.SDK_INT == Build.VERSION_CODES.Q) {
                                ActivityCompat.requestPermissions(
