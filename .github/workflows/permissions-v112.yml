          p.write_text(s)

          g=Path('app/build.gradle')
          x=g.read_text()
          x=x.replace('// 1.3.11: notificações oficiais + rota/Flash + paradas + espera do passageiro + vídeo nativo.', '// 1.3.12: diagnóstico completo de permissões e alerta preventivo do MōB Flash.')
          if x.count('versionCode 224') != 1 or x.count('versionName "1.3.11"') != 1:
              raise SystemExit('versão base inesperada')
          x=x.replace('versionCode 224','versionCode 225').replace('versionName "1.3.11"','versionName "1.3.12"')
          g.write_text(x)
          PY
