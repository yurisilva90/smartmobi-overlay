            @JavascriptInterface fun isBatteryOptimizationExempt(): Boolean = this@MainActivity.isBatteryOptimizationExempt()
            @JavascriptInterface fun openBatterySettings() {
                runOnUiThread {
                    try {
                        startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                    } catch (_: Exception) {
                        try { startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) } catch (_: Exception) {}
                    }
                }
            }

            @JavascriptInterface fun hasPostNotificationsPermission(): Boolean = this@MainActivity.hasPostNotificationsPermission()
            @JavascriptInterface fun requestPostNotifications() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && !this@MainActivity.hasPostNotificationsPermission()) {
                    runOnUiThread {
                        ActivityCompat.requestPermissions(this@MainActivity, arrayOf(Manifest.permission.POST_NOTIFICATIONS), REQ_PERM)
                    }
                }
            }

            @JavascriptInterface fun requiresSeparateScreenCapture(): Boolean = Build.VERSION.SDK_INT < Build.VERSION_CODES.R

