name: Patch MoB 1.3.26 status foreground guard
on:
  push:
    paths: ['.github/workflows/patch-1.3.23.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply status foreground guard
        run: python3 .github/scripts/patch_status_foreground_guard_1326.py
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m 'Keep ride status when MōB is foreground'
          git push
