name: Finalizar status das corridas automaticas
on:
  push:
    paths:
      - '.github/workflows/finalize-trip-status.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste
        run: python3 .tmp-finalize-trip-status.py
      - name: Validar e publicar
        run: |
          grep -q 'val status = "estimada"' app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'put("capture_source", "automatica")' app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'put("value_needs_review", true)' app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'versionCode 221' app/build.gradle
          grep -q 'versionName "1.3.8"' app/build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat: unificar corridas pendentes como aguardando confirmacao"
          git push
