name: Apply hybrid 1.3.9 Java17 v2
on:
  push:
    branches: [ notif-hybrid-1-3-9 ]
    paths:
      - '.github/workflows/apply-hybrid-139-java17-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notif-hybrid-1-3-9
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Aplicar ajustes Android
        run: |
          python3 .tmp-apply-hybrid-139.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('!n.isOngoing', '(n.flags and Notification.FLAG_ONGOING_EVENT) == 0')
          s=s.replace('put("is_ongoing", n.isOngoing)', 'put("is_ongoing", (n.flags and Notification.FLAG_ONGOING_EVENT) != 0)')
          if 'n.isOngoing' in s: raise SystemExit('isOngoing antigo ainda presente')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compilar antes de publicar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar patch na branch
        run: |
          rm -f .tmp-apply-hybrid-139.py \
            .github/workflows/apply-hybrid-139.yml \
            .github/workflows/apply-hybrid-139-java17.yml \
            .github/workflows/apply-hybrid-139-java17-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: detector híbrido Uber 99 e vídeo nativo 1.3.9"
          git push origin HEAD:notif-hybrid-1-3-9
