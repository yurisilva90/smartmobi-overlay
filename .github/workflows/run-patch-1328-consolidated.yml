name: Patch MoB 1.3.28 consolidated native fixes
on:
  push:
    paths:
      - '.github/workflows/run-patch-1328-consolidated.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply consolidated patch
        run: python3 .github/scripts/patch_1328_consolidated.py
      - name: Validate native markers
        run: |
          grep -q "activeDriverPlatformForStatus" app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt
          grep -q "OFFER_MAX_AGE_OVERLAP_MS" app/src/main/java/io/github/yurisilva90/smartmobi/AutoTripCapture.kt
          grep -q 'versionCode 240' app/build.gradle
          grep -q 'versionName "1.3.28"' app/build.gradle
      - name: Commit native changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m 'Consolidate native fixes in MoB 1.3.28' || exit 0
          git push
