name: Apply Flash image and route
on:
  push:
    paths: ['.github/workflows/apply-flash-image-route.yml']
jobs:
  patch:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply patch
        run: python3 apply_flash_image_route.py
      - name: Compile
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Commit and sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/src/main/java/io/github/yurisilva90/smartmobi/DriverNotificationListenerService.kt app/build.gradle
          git rm -f --ignore-unmatch \
            .github/workflows/apply-flash-image-route.yml \
            .github/workflows/inspect-notif-route.yml \
            .github/workflows/apply-permission-bridge.yml \
            .github/workflows/permissions-v112.yml \
            .github/workflows/finish-flash-notification.yml \
            .github/workflows/apply-route-notification-v1313.yml \
            _notif_route_snippet.txt \
            apply_flash_image_route.py \
            permissions-v112.py \
            tools/finish_flash_notification.py \
            tools/patch_route_notification_v1313.py
          git commit -m 'fix: incluir imagem do Flash e completar rota da oferta'
          git pull --rebase origin main
          git push origin main
