name: Aplicar rastreamento de status da jornada

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: aplicar rastreamento de status da jornada' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar patch
        run: |
          python3 .github/patch-journey-status.py
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/patch-journey-status.py .github/workflows/temporario-journey-status.yml .github/trigger-journey-status.txt
          git add app/src/main/java/io/github/yurisilva90/smartmobi/MainActivity.kt app/src/main/java/io/github/yurisilva90/smartmobi/TripReaderService.kt app/build.gradle
          git commit -m "feat: persistir status da jornada independente da corrida"
          git push origin HEAD:main
